[project]
name = "what-the-docs"
version = "0.1.0"
description = "Production-grade PDF Retrieval (RAG) Backend"
readme = "README.md"
authors = [
    { name = "arjunomray", email = "arjunomray@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.20",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-watcher>=0.6.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
